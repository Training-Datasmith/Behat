default:
    extensions:
        # Loads the custom classes we need for this feature
        class_references_loader.php: ~
        # Is referenced exactly by its class name, and the class is defined, so will be imported & referenced
        Some\Behat\Extension\Explicitly_Referenced_Extension: ~
        # Uses the "automagic" Some\Shorthand_Extension
        # Will be converted to the actual Some\Shorthand_Extension\Service_Container\Shorthand_Extension class reference
        Some\Shorthand_Extension: ~
    suites:
        named_contexts:
            contexts:
                # Undefined class (could be a service locator), left as a string
                - UnknownContext
                # These classes are all defined and will be imported
                - MyContext
                - test\My_App\Contexts\My_First_Context
                - test\My_App\Contexts\My_Second_Context

        contexts_with_args:
            contexts:
                - UnknownContext
                - test\My_App\Contexts\My_First_Context:
                      - param1
                - test\My_App\Contexts\My_Second_Context
